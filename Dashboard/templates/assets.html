{% extends "base.html" %}
{% block title %}Assets{% endblock %}
{% block page_heading %}Assets{% endblock %}

{% block content %}

<div class="section-heading">OT/IT Asset Inventory</div>

<!-- Filter bar -->
<div class="filter-bar mb-3">
    <button class="filter-btn active" onclick="filterAssets('ALL', this)">ALL</button>
    <button class="filter-btn" onclick="filterAssets('ACTIVE', this)">ACTIVE</button>
    <button class="filter-btn" onclick="filterAssets('NOT_MONITORED', this)">NOT MONITORED</button>
    <button class="filter-btn" onclick="filterAssets('OT', this)">OT ZONE</button>
    <button class="filter-btn" onclick="filterAssets('IT', this)">IT ZONE</button>
    <input class="ot-search ms-auto" type="text" id="asset-search" placeholder="Search vendor / product / IP..." oninput="searchAssets(this.value)" style="width:260px">
</div>

<!-- Assets grid -->
<div id="assets-loading" class="text-center py-5">
    <div class="ot-spinner" style="width:32px;height:32px;border-width:3px"></div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:12px">LOADING ASSETS...</div>
</div>

<div id="assets-grid" class="row g-3" style="display:none"></div>

<!-- Asset detail modal -->
<div id="assetModal" tabindex="-1"
     style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;
            overflow-y:auto;padding:30px 16px;box-sizing:border-box">
    <div style="width:100%;max-width:900px;margin:0 auto;background:var(--bg-panel);
                border:1px solid var(--border);border-radius:6px;
                box-shadow:0 20px 60px rgba(0,0,0,0.7)">
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;
                    background:var(--bg-dark);border-bottom:1px solid var(--border);
                    padding:14px 18px;border-radius:6px 6px 0 0;gap:12px">
            <h5 id="modal-asset-title"
                style="font-family:'Orbitron',monospace;font-size:13px;color:var(--accent-cyan);
                       margin:0;word-break:break-word">
                ASSET DETAIL
            </h5>
            <button onclick="closeAssetModal()"
                style="background:transparent;border:1px solid var(--border);color:var(--text-muted);
                       min-width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px;
                       display:flex;align-items:center;justify-content:center;flex-shrink:0">✕</button>
        </div>
        <!-- Body -->
        <div style="padding:18px;overflow-x:auto">
            <div class="row g-3 mb-4" id="modal-asset-info"></div>
            <div class="section-heading">Mapped Vulnerabilities</div>
            <div id="modal-cves-loading" class="text-center py-3"><div class="ot-spinner"></div></div>
            <div id="modal-cves-wrap" style="display:none;overflow-x:auto;width:100%">
                <table class="ot-table" style="min-width:600px">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>CVE ID</th>
                            <th>CVSS</th>
                            <th>EPSS</th>
                            <th>Risk Score</th>
                            <th>Tier</th>
                            <th>CIA</th>
                        </tr>
                    </thead>
                    <tbody id="modal-cves-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- Modal backdrop -->
<div id="modal-backdrop" onclick="closeAssetModal()"
     style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.75);z-index:9998"></div>

{% endblock %}

{% block scripts %}
<script>
let allAssets = [];
let currentFilter = 'ALL';
let assetsLoaded = false;

// Saved scan remains visible; the API supplies current monitoring status.
loadAssets();
CaveOT.onScanState((running,changed)=>{if(changed){loadAssets();}});

async function loadAssets() {
    const r = await fetch('/api/assets');
    allAssets = await r.json();
    document.getElementById('assets-loading').style.display = 'none';
    document.getElementById('assets-grid').style.display = '';
    renderAssets(allAssets);
    applyFilters();
}

function renderAssets(assets) {
    const grid = document.getElementById('assets-grid');
    if (!assets.length) {
        grid.innerHTML = `<div class="col-12"><div class="empty-state"><i class="bi bi-hdd-network"></i><p>NO ASSETS FOUND</p></div></div>`;
        return;
    }
    grid.innerHTML = assets.map(a => {
        const critPct = Math.round((a.criticality || 0) * 100);
        const maxRisk = a.max_risk_score;
        const hasRisk = typeof maxRisk === 'number' && Number.isFinite(maxRisk);
        const riskCol = riskColor(maxRisk);
        const statusIcon = a.status === 'ACTIVE'
            ? '<span class="status-dot" style="display:inline-block"></span>'
            : '<span style="width:8px;height:8px;border-radius:50%;background:var(--text-muted);display:inline-block;margin-right:6px"></span>';

        return `
        <div class="col-12 col-md-6 col-xl-4 asset-card-wrap"
             data-status="${a.status}" data-zone="${escapeHtml(a.zone)}"
             data-search="${(a.vendor+' '+a.product+' '+a.ip).toLowerCase()}">
            <div class="panel h-100" style="cursor:pointer;transition:border-color 0.2s"
                 onmouseenter="this.style.borderColor='var(--border-glow)'"
                 onmouseleave="this.style.borderColor='var(--border)'"
                 onclick="openAsset(${a.id}, '${escapeHtml(a.vendor)} ${escapeHtml(a.product)}')">

                <!-- Card header -->
                <div class="panel-header" style="background:var(--bg-dark)">
                    <div>
                        <div style="font-family:'Orbitron',monospace;font-size:12px;color:var(--text-primary);font-weight:700">
                            ${escapeHtml(a.vendor)}
                        </div>
                        <div style="font-size:13px;color:var(--text-muted);margin-top:2px">${escapeHtml(a.product)}</div>
                    </div>
                    <div class="text-end">
                        <span class="zone-${escapeHtml(a.zone)}">${escapeHtml(a.zone)}</span>
                        <div style="margin-top:4px;font-family:'Share Tech Mono',monospace;font-size:10px">
                            ${statusIcon}<span class="status-${a.status}" style="font-size:10px">${escapeHtml(a.status_label||a.status)}</span>
                        </div>
                        <div style="margin-top:4px">${anomalyBadge(a.is_anomalous, a.anomaly_score, a.anomaly_reason)}</div>
                    </div>
                </div>

                <div class="panel-body">
                    <!-- IP / Port / Service -->
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px">IP</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent-cyan)">${escapeHtml(a.ip)}</div>
                        </div>
                        <div class="col-4">
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px">PORT</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:12px">${a.port}</div>
                        </div>
                        <div class="col-4">
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px">SERVICE</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent-orange)">${escapeHtml(a.service || '—')}</div>
                        </div>
                    </div>

                    <!-- Firmware / Device type -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px">FIRMWARE</div>
                            <div style="font-size:13px">${escapeHtml(a.firmware || '—')}</div>
                        </div>
                        <div class="col-6">
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px">TYPE</div>
                            <div style="font-size:12px;color:var(--text-muted)">${(a.device_type || '—').replace(/_/g,' ')}</div>
                        </div>
                    </div>

                    <!-- Criticality -->
                    <div class="mb-3">
                        <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px;margin-bottom:4px">
                            CRITICALITY — ${critPct}%
                        </div>
                        <div class="risk-bar" style="height:6px">
                            <div class="risk-bar-fill" style="width:${critPct}%;background:linear-gradient(90deg,var(--accent-green),var(--accent-orange),var(--accent-red))"></div>
                        </div>
                    </div>

                    <!-- CVE counts -->
                    <div class="d-flex gap-2 flex-wrap">
                        <div style="flex:1;text-align:center;background:rgba(255,51,85,0.08);border:1px solid rgba(255,51,85,0.2);border-radius:2px;padding:6px 4px">
                            <div style="font-family:'Orbitron',monospace;font-size:16px;color:var(--critical)">${a.critical_cves || 0}</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted)">CRITICAL</div>
                        </div>
                        <div style="flex:1;text-align:center;background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.2);border-radius:2px;padding:6px 4px">
                            <div style="font-family:'Orbitron',monospace;font-size:16px;color:var(--high)">${a.high_cves || 0}</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted)">HIGH</div>
                        </div>
                        <div style="flex:1;text-align:center;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);border-radius:2px;padding:6px 4px">
                            <div style="font-family:'Orbitron',monospace;font-size:16px;color:var(--accent-cyan)">${a.total_cves || 0}</div>
                            <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted)">TOTAL</div>
                        </div>
                    </div>

                    <!-- Max risk -->
                    <div class="mt-3">
                        <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px;margin-bottom:4px">MAX RISK SCORE</div>
                        ${hasRisk ? riskBar(maxRisk) : '<span style="color:var(--text-muted);font-size:12px">Not assessed — no scored CVE association</span>'}
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function filterAssets(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
}

function searchAssets(q) { applyFilters(); }

function applyFilters() {
    const q = document.getElementById('asset-search').value.toLowerCase();
    document.querySelectorAll('.asset-card-wrap').forEach(el => {
        const matchFilter =
            currentFilter === 'ALL' ||
            el.dataset.status === currentFilter ||
            el.dataset.zone === currentFilter;
        const matchSearch = !q || el.dataset.search.includes(q);
        el.style.display = (matchFilter && matchSearch) ? '' : 'none';
    });
}

async function openAsset(id, name) {
    document.getElementById('modal-asset-title').textContent = name.toUpperCase();
    document.getElementById('modal-cves-loading').style.display = 'block';
    document.getElementById('modal-cves-wrap').style.display = 'none';
    document.getElementById('modal-cves-body').innerHTML = '';

    // show backdrop + modal
    const modal    = document.getElementById('assetModal');
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.style.display = 'block';
    modal.style.display    = 'block';
    document.body.style.overflow = 'hidden';

    const r = await fetch(`/api/assets/${id}/cves`);
    const cves = await r.json();

    document.getElementById('modal-cves-loading').style.display = 'none';
    document.getElementById('modal-cves-wrap').style.display = 'block';

    const tbody = document.getElementById('modal-cves-body');
    if (!cves.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4"
            style="color:var(--text-muted);font-family:'Share Tech Mono',monospace;font-size:12px">
            NO CVEs MAPPED</td></tr>`;
        return;
    }
    tbody.innerHTML = cves.map((v, i) => `
        <tr>
            <td style="color:var(--text-muted);font-family:'Share Tech Mono',monospace;font-size:11px">${i+1}</td>
            <td>
                <a href="https://nvd.nist.gov/vuln/detail/${escapeHtml(v.cve_id)}" target="_blank"
                   style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent-cyan);text-decoration:none"
                   onmouseover="this.style.textDecoration='underline'"
                   onmouseout="this.style.textDecoration='none'">${escapeHtml(v.cve_id)}</a>
            </td>
            <td><span style="font-family:'Share Tech Mono',monospace;color:${riskColor(v.cvss)}">${v.cvss}</span></td>
            <td><span style="font-family:'Share Tech Mono',monospace;font-size:12px">${(v.epss*100).toFixed(2)}%</span></td>
            <td style="min-width:130px">${riskBar(v.risk_score)}</td>
            <td>${tierBadge(v.risk_tier)}</td>
            <td>
                <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--accent-red)">C:${v.c_impact??'Unknown'}</span>
                <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--accent-orange);margin:0 4px">I:${v.i_impact??'Unknown'}</span>
                <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--accent-yellow)">A:${v.a_impact??'Unknown'}</span>
            </td>
        </tr>
    `).join('');
}

function closeAssetModal() {
    document.getElementById('assetModal').style.display    = 'none';
    document.getElementById('modal-backdrop').style.display = 'none';
    document.body.style.overflow = '';
}

// close on Escape key
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAssetModal(); });
setInterval(()=>{if(!document.hidden){loadAssets();}},15000);
</script>
{% endblock %}
