[pytest]
testpaths = tests
addopts = -v -p no:cacheprovider
# DB integration tests are opt-in: set CAVE_OT_TEST_DB=1 to enable them.
# UI browser tests require Node.js to be on PATH.
# Remediation advisor LLM tests (Groq) are excluded — they require a live
# GROQ_API_KEY and make outbound network calls.
markers =
    db: requires live PostgreSQL (CAVE_OT_TEST_DB=1)
    browser: requires Node.js on PATH
    slow: long-running property-based tests
